<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Configurateur de Tenue de Soutenance | ENMIIS</title>
  <meta name="description" content="Configurateur ENMIIS : téléversez vos designs, composez robe, capuche, mortier et gland, saisissez vos mesures et envoyez votre demande de fabrication.">
  <meta name="theme-color" content="#FFFFFF">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/customizer.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='18' fill='%23C8A86B' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
</head>
<body class="cz-body">

  <a class="skip-link" href="#czPanel">Aller à la configuration</a>

  <!-- ======================= TOPBAR (inchangée) ======================= -->
  <header class="cz-topbar">
    <a class="cz-topbar__back" href="soutenance.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg>
      <span>Soutenances</span>
    </a>
    <a class="cz-topbar__logo" href="index.html" aria-label="Accueil ENMIIS">
      <img src="img/logo-enmiis.png" alt="ENMIIS">
    </a>
    <div class="cz-topbar__actions">
      <button class="cz-iconbtn" id="czUndo" type="button" aria-label="Annuler la dernière modification" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a7 7 0 0 1 0 14h-3"/></svg>
      </button>
      <button class="cz-iconbtn" id="czReset" type="button" aria-label="Tout réinitialiser">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><polyline points="20 3 20 8 15 8"/></svg>
      </button>
    </div>
  </header>

  <!-- ======================= PROGRESSION ======================= -->
  <div class="cz-progress">
    <div class="cz-progress__bar" id="czProgressBar"></div>
  </div>

  <nav class="cz-rail" aria-label="Étapes de la configuration">
    <ol class="cz-rail__track" id="czRail"><!-- généré par customizer.js --></ol>
  </nav>

  <main class="cz-layout" id="main">

    <!-- ======================= APERÇU ======================= -->
    <section class="cz-preview" aria-label="Aperçu de votre tenue">
      <div class="cz-stage" id="czStage">
        <div class="cz-stage__scene" id="czScene">
          <div class="cz-stage__float" id="czFloat">
            <svg id="czSvg" viewBox="0 0 400 560" role="img" aria-label="Aperçu en direct de votre tenue personnalisée">
              <defs>
                <linearGradient id="czShade" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#000" stop-opacity="0.14"/>
                  <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
                  <stop offset="1" stop-color="#000" stop-opacity="0.16"/>
                </linearGradient>
                <linearGradient id="czSheen" x1="0" y1="0" x2="1" y2="0.3">
                  <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                  <stop offset="0.42" stop-color="#fff" stop-opacity="0.18"/>
                  <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
                </linearGradient>
                <radialGradient id="czGroundGrad" cx="0.5" cy="0.5" r="0.5">
                  <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
                  <stop offset="1" stop-color="#000" stop-opacity="0"/>
                </radialGradient>
                <clipPath id="czGownClip">
                  <path d="M150 92 C 200 70 200 70 250 92 C 254 208 260 354 268 500 L 132 500 C 140 354 146 208 150 92 Z"/>
                </clipPath>
              </defs>

              <!-- ombre portée douce -->
              <ellipse id="czGround" cx="200" cy="512" rx="118" ry="17" fill="url(#czGroundGrad)"/>

              <!-- ============ ROBE ============ -->
              <g id="czGown">
                <!-- manches -->
                <path class="cz-p-sleeve" id="czSleeveL" d="M154 88 C 120 150 96 232 82 314 C 102 332 128 336 152 326 C 158 250 160 172 166 100 Z"/>
                <path class="cz-p-sleeve" id="czSleeveR" d="M246 88 C 280 150 304 232 318 314 C 298 332 272 336 248 326 C 242 250 240 172 234 100 Z"/>
                <path class="cz-p-accent cz-cuff" d="M84 300 C 104 318 128 322 150 314 L 152 326 C 128 336 102 332 82 314 Z"/>
                <path class="cz-p-accent cz-cuff" d="M316 300 C 296 318 272 322 250 314 L 248 326 C 272 336 298 332 318 314 Z"/>

                <!-- corps -->
                <path class="cz-p-main" d="M150 92 C 200 70 200 70 250 92 C 254 208 260 354 268 500 L 132 500 C 140 354 146 208 150 92 Z"/>
                <g clip-path="url(#czGownClip)">
                  <path d="M150 92 C 200 70 200 70 250 92 C 254 208 260 354 268 500 L 132 500 C 140 354 146 208 150 92 Z" fill="url(#czShade)"/>
                  <rect class="cz-sheen" x="120" y="70" width="160" height="440" fill="url(#czSheen)"/>
                  <g class="cz-folds" id="czFolds">
                    <path d="M170 130 C 168 250 164 380 160 490"/>
                    <path d="M186 128 C 185 250 183 380 181 490"/>
                    <path d="M214 128 C 215 250 217 380 219 490"/>
                    <path d="M230 130 C 232 250 236 380 240 490"/>
                  </g>
                </g>

                <!-- chevrons de manches -->
                <g id="czChevrons">
                  <path class="cz-p-accent" d="M102 214 C 118 224 136 226 152 222 L 152 234 C 134 238 114 236 99 227 Z"/>
                  <path class="cz-p-accent" d="M94 254 C 112 264 132 266 151 262 L 151 274 C 130 278 108 276 91 266 Z"/>
                  <path class="cz-p-accent" d="M298 214 C 282 224 264 226 248 222 L 248 234 C 266 238 286 236 301 227 Z"/>
                  <path class="cz-p-accent" d="M306 254 C 288 264 268 266 249 262 L 249 274 C 270 278 292 276 309 266 Z"/>
                </g>

                <!-- bordure / parement -->
                <g id="czTrim">
                  <path class="cz-p-trim" d="M181 90 L 172 500 L 190 500 L 195 92 Z"/>
                  <path class="cz-p-trim" d="M219 90 L 228 500 L 210 500 L 205 92 Z"/>
                </g>
                <path class="cz-p-collar" id="czCollar" d="M168 92 C 190 78 210 78 232 92 L 225 104 C 208 92 192 92 175 104 Z"/>
              </g>

              <!-- ============ CAPUCHE / ÉTOLE ============ -->
              <g id="czHood"><!-- injecté par customizer.js --></g>

              <!-- ============ MORTIER ============ -->
              <g id="czCap"><!-- injecté par customizer.js --></g>

              <!-- ============ GLAND ============ -->
              <g id="czTassel"><!-- injecté par customizer.js --></g>

              <!-- ============ BRODERIES ============ -->
              <g id="czEmb">
                <image id="czLogoUni" width="40" height="40" href="" preserveAspectRatio="xMidYMid meet" style="display:none"/>
                <image id="czLogoFac" width="34" height="34" href="" preserveAspectRatio="xMidYMid meet" style="display:none"/>
                <text id="czEmbText" text-anchor="middle" font-size="13"></text>
              </g>
            </svg>
          </div>
        </div>

        <div class="cz-stage__tools">
          <button type="button" class="cz-tool" id="czZoomOut" aria-label="Dézoomer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"/></svg>
          </button>
          <button type="button" class="cz-tool" id="czZoomIn" aria-label="Zoomer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
          </button>
          <button type="button" class="cz-tool" id="czSpin" aria-label="Rotation automatique" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><polyline points="20 3 20 8 15 8"/></svg>
          </button>
          <button type="button" class="cz-tool" id="czRecenter" aria-label="Recentrer la vue">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
          </button>
        </div>

        <p class="cz-stage__hint" id="czHint">Glissez pour tourner<span class="cz-stage__hint-long"> · molette pour zoomer</span></p>
        <p class="cz-stage__angle" id="czAngle" aria-live="off">Face</p>
      </div>
    </section>

    <!-- ======================= PANNEAU ======================= -->
    <section class="cz-panel" id="czPanel" aria-label="Configuration de la commande">
      <header class="cz-panel__head">
        <p class="cz-panel__label" id="czPhase">Le configurateur ENMIIS</p>
        <h1 class="cz-panel__title" id="czStepTitle">Composez Votre Tenue</h1>
        <p class="cz-panel__sub" id="czStepSub"></p>
      </header>

      <div class="cz-screens" id="czScreens"><!-- généré par customizer.js --></div>

      <footer class="cz-nav">
        <button class="btn btn--line cz-nav__prev" id="czPrev" type="button">Retour</button>
        <p class="cz-nav__count" id="czStepCount"></p>
        <button class="btn btn--solid cz-nav__next" id="czNext" type="button">Continuer</button>
      </footer>
    </section>
  </main>

  <!-- ======================= MODALE « COMMENT MESURER » ======================= -->
  <div class="cz-modal" id="czGuide" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="czGuideTitle">
    <div class="cz-modal__backdrop" data-cz-close></div>
    <div class="cz-modal__panel cz-guide">
      <button class="cz-modal__close" type="button" aria-label="Fermer" data-cz-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
      <p class="cz-guide__label">Comment mesurer</p>
      <h2 class="cz-guide__title" id="czGuideTitle"></h2>
      <div class="cz-guide__figure" id="czGuideFigure"></div>
      <ol class="cz-guide__steps" id="czGuideSteps"></ol>
      <p class="cz-guide__tip" id="czGuideTip"></p>
    </div>
  </div>

  <!-- ======================= MODALE APERÇU FICHIER ======================= -->
  <div class="cz-modal" id="czLightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="czLightboxTitle">
    <div class="cz-modal__backdrop" data-cz-close></div>
    <div class="cz-modal__panel cz-lightbox">
      <button class="cz-modal__close" type="button" aria-label="Fermer" data-cz-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
      <h2 class="cz-lightbox__title" id="czLightboxTitle"></h2>
      <div class="cz-lightbox__body" id="czLightboxBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/main.js" defer></script>
  <script src="js/cz-catalog.js" defer></script>
  <script src="js/cz-store.js" defer></script>
  <script src="js/cz-preview.js" defer></script>
  <script src="js/cz-steps.js" defer></script>
  <script src="js/customizer.js" defer></script>
</body>
</html>
